plugins {
    id 'java'
    id 'org.springframework.boot' version '2.6.3'
    id 'io.spring.dependency-management' version '1.1.0'
}

group 'com.example'
version '1.0-SNAPSHOT'
sourceCompatibility = 16

apply plugin: 'maven-publish'

publishing {
    publications {
        maven(MavenPublication){
            artifact("build/libs/my-app-$version-plain"+".jar"){
                extension 'jar'
            }
        }
    }
    repositories  {
        maven {
            name 'nexus'
            // Replace with your own Nexus host, e.g. via -PnexusUrl=http://<host>:8081/...
            url project.findProperty('nexusUrl') ?: "http://<your-nexus-host>:8081/repository/maven-snapshots/"
            credentials {
                username project.repoUser
                password project.repoPassword
                allowInsecureProtocol = true

            }
        }
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation group: 'net.logstash.logback', name: 'logstash-logback-encoder', version: '7.3'
    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
    implementation "javax.annotation:javax.annotation-api:1.3.2"
}
